@if (!thyDone()) {
  <span class="thy-loading-indicator">
    <span class="thy-loading-ellipsis">
      <span class="thy-spot"></span>
    </span>
    @if (tips()) {
      <span class="thy-loading-tips">{{ tips() }}</span>
    }
  </span>
}
@if (thyIsMask() || thyDone()) {
  <div class="thy-loading-container">
    <ng-content></ng-content>
  </div>
}
