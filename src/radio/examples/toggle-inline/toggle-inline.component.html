<p>通过 <code>thyInline</code> 控制选项是行内样式还是块级样式。</p>
<div class="mb-2">
  <label thyCheckbox thyInline="true" [(ngModel)]="inlineStatus" thyLabelText="Toggle inline"></label>
</div>

<thy-radio-group [(ngModel)]="checkedValue">
  <label thyRadio thyLabelText="选项一" [thyValue]="1" [thyInline]="inlineStatus"></label>
  <label thyRadio thyLabelText="选项二" [thyValue]="2" [thyInline]="inlineStatus"></label>
  <label thyRadio thyLabelText="选项三" [thyValue]="3" [thyInline]="inlineStatus"></label>
</thy-radio-group>
