<div thyRow [thyGutter]="30">
  <div thyCol [thySpan]="12">
    <thy-input-search
      (keydown.enter)="change()"
      [(ngModel)]="searchText"
      (ngModelChange)="change()"
      (thyClear)="change()"
      thyPlaceholder="Search"></thy-input-search>

    <thy-input-search
      [disabled]="true"
      [(ngModel)]="searchText"
      thyPlaceholder="Disabled, can't type (thy-input)"
      class="mt-3"></thy-input-search>
  </div>
  <div thyCol [thySpan]="12">
    <thy-input-search
      (keydown.enter)="change()"
      [(ngModel)]="searchText"
      (ngModelChange)="change()"
      (thyClear)="change()"
      thyIconPosition="after"
      thyPlaceholder="Search"></thy-input-search>

    <thy-input-search
      [disabled]="true"
      [(ngModel)]="searchText"
      thyIconPosition="after"
      thyPlaceholder="Search"
      class="mt-3"></thy-input-search>
  </div>
</div>
