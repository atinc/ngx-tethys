<div thyRow [thyGutter]="30">
  <div thyCol [thySpan]="12">
    <thy-input-search [(ngModel)]="value" [thyAppearance]="'outline'" [thyPlaceholder]="'outline'"></thy-input-search>
    <thy-input-search [(ngModel)]="value" [thyAppearance]="'subtle'" [thyPlaceholder]="'subtle'" class="mt-3"></thy-input-search>
    <thy-input-search [(ngModel)]="value" [thyAppearance]="'ghost'" [thyPlaceholder]="'ghost'" class="mt-3"></thy-input-search>
  </div>
  <div thyCol [thySpan]="12">
    <thy-input-search [(ngModel)]="value" [thyAppearance]="'outline'" [thyPlaceholder]="'outline'" [disabled]="true"></thy-input-search>
    <thy-input-search
      [(ngModel)]="value"
      [thyAppearance]="'subtle'"
      [thyPlaceholder]="'subtle'"
      class="mt-3"
      [disabled]="true"></thy-input-search>
    <thy-input-search
      [(ngModel)]="value"
      [thyAppearance]="'ghost'"
      [thyPlaceholder]="'ghost'"
      class="mt-3"
      [disabled]="true"></thy-input-search>
  </div>
</div>
