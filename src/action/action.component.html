@if (icon() && !feedback()) {
  <thy-icon [thyName]="icon()"></thy-icon>
}
@if (feedbackOptions()?.icon) {
  <thy-icon [class]="feedbackOptions()?.class" [thyName]="$safeNavigationMigration(feedbackOptions()?.icon)"></thy-icon>
}
@if (thyHoverIcon()) {
  <thy-icon class="hover-icon" [thyName]="thyHoverIcon()"></thy-icon>
}
<ng-content></ng-content>
