<thy-native-table #nativeTable [thyData]="data" [thyScroll]="{ x: '100%' }">
  <thead>
    <tr>
      <th thyWidth="100px" thyFixedLeft>Id</th>
      <th thyWidth="200px">Name</th>
      <th thyWidth="200px" thyFixedLeft>Age</th>
      <th thyWidth="200px">Job</th>
      <th thyWidth="300px">Address</th>
      <th thyWidth="300px">Column1</th>
      <th thyWidth="300px">Column2</th>
      <th thyWidth="300px">Column3</th>
      <th thyWidth="200px" thyFixedRight></th>
    </tr>
  </thead>
  <tbody>
    @for (row of nativeTable.data(); track row.id) {
      <tr>
        <td>{{ row.id }}</td>
        <td>{{ row.name }}</td>
        <td>{{ row.age }}</td>
        <td>{{ row.job }}</td>
        <td>{{ row.address }}</td>
        <td>{{ row.address }}</td>
        <td>{{ row.address }}</td>
        <td>{{ row.address }}</td>
        <td>
          <a class="link-secondary mr-8" href="javascript:;">
            <thy-icon thyName="user-add"></thy-icon>
          </a>
          <a class="link-danger-weak" href="javascript:;">
            <thy-icon thyName="trash"></thy-icon>
          </a>
        </td>
      </tr>
    }
  </tbody>
</thy-native-table>
