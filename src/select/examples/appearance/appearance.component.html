<div thyRow [thyGutter]="30">
  <div thyCol [thySpan]="12">
    @for (item of appearances; track item.value) {
      <div class="mb-3">
        <div class="mb-2 text-secondary">{{ item.label }}</div>
        <thy-select [(ngModel)]="value" [thyAppearance]="item.value" thyPlaceholder="请选择">
          @for (option of listOfOption; track option.value) {
            <thy-option [thyValue]="option.value" [thyLabelText]="option.text"></thy-option>
          }
        </thy-select>
      </div>
    }
  </div>
  <div thyCol [thySpan]="12">
    @for (item of appearances; track item.value) {
      <div class="mb-3">
        <div class="mb-2 text-secondary">{{ item.label }}（disabled）</div>
        <thy-select [(ngModel)]="value" [thyAppearance]="item.value" [thyDisabled]="true" thyPlaceholder="请选择">
          @for (option of listOfOption; track option.value) {
            <thy-option [thyValue]="option.value" [thyLabelText]="option.text"></thy-option>
          }
        </thy-select>
      </div>
    }
  </div>
</div>
