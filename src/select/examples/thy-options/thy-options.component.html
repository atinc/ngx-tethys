<thy-select
  [ngModel]="value"
  (thyScrollToBottom)="onScrollToBottom()"
  thyEnableScrollLoad="true"
  style="width: 500px"
  thyPlaceholder="滚动加载"
  [thyOptions]="loadMoreOptions()">
  @if (loading()) {
    <div class="loading-more font-size-xs text-desc">加载中...</div>
  }
</thy-select>
<br />
<thy-select
  thyPlaceholder="多选可搜索"
  [thySearchable]="true"
  [ngModel]="multipleValue"
  style="width: 500px"
  thyMultiple
  [thyOptions]="options()">
</thy-select>
<br />

<thy-select
  [thyOptions]="options()"
  thyPlaceholder="自定义 Footer"
  [thySearchable]="true"
  style="width: 500px"
  [thyFooterTemplate]="footer">
  <ng-template #footer>
    <a class="flex-grow-1">更多选项</a>
  </ng-template>
</thy-select>
<br />
<thy-select style="width: 500px" thyPlaceholder="选项图标" [thyOptions]="optionsWithIcon" [(ngModel)]="iconValue"> </thy-select>
