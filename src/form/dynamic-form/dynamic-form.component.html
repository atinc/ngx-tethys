<form [formRoot]="fieldTree" (reset)="handleReset($event)">
  <div thyRow [thyGutter]="30">
    @for (field of fields(); track field.key) {
      @let invalid = showError(field);
      <thy-form-group
        thyCol
        [thySpan]="field.col | thyDynamicFormSpan"
        [thyLabelText]="field.props?.label"
        [thyLabelRequired]="!!field.props?.required">
        @switch (field.kind) {
          @case ('input') {
            <input
              thyInput
              [formField]="getField(field.key)"
              [id]="field.key"
              [name]="field.key"
              [class.is-invalid]="invalid"
              [attr.placeholder]="field.props?.placeholder || null"
              [attr.type]="field.props?.type || 'text'"
              [thySize]="thySize()" />
          }
          @case ('number') {
            <thy-input-number
              [formField]="getField(field.key)"
              [id]="field.key"
              [attr.name]="field.key"
              [class.is-invalid]="invalid"
              [thyPlaceholder]="field.props?.placeholder || null"
              [thySuffix]="field.props?.suffix"
              [thyMax]="field.props?.max"
              [thyMin]="field.props?.min"
              [thyStep]="field.props?.step"
              [thySize]="thySize()" />
          }
          @case ('textarea') {
            <textarea
              thyInput
              [formField]="getField(field.key)"
              [id]="field.key"
              [name]="field.key"
              [class.is-invalid]="invalid"
              [attr.placeholder]="field.props?.placeholder || null"
              [attr.rows]="field.props?.rows ?? 3"
              [style.resize]="field.props?.resize ?? 'none'"
              [thySize]="thySize()"></textarea>
          }
          @case ('select') {
            <thy-select
              [formField]="getField(field.key)"
              [id]="field.key"
              [attr.name]="field.key"
              [class.is-invalid]="invalid"
              [thyDisabled]="getField(field.key)().disabled()"
              [thyOptions]="field.props?.options ?? []"
              [thyPlaceholder]="field.props?.placeholder ?? ''"
              [thySearchable]="field.props?.searchable"
              [thyClearable]="field.props?.clearable"
              [thyMultiple]="field.props?.multiple"
              [thyEmptyStateText]="field.props?.emptyText ?? ''"
              [thySearchEmptyText]="field.props?.searchEmptyText ?? ''"
              [thySize]="thySize()" />
          }
          @default {
            <span class="invalid-feedback">Unsupported field kind.</span>
          }
        }
        @if (invalid) {
          <div class="invalid-feedback">{{ errorMessage(field) }}</div>
        }
      </thy-form-group>
    }
    <div thyCol [thySpan]="24">
      <ng-content></ng-content>
    </div>
  </div>
</form>
