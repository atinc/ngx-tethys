<div class="d-flex align-items-center mb-3">
  <span class="mr-2">Form size</span>
  <thy-select
    class="mr-3"
    style="width: 120px"
    [ngModel]="size()"
    (ngModelChange)="onSizeChange($event)"
    [thyOptions]="sizeOptions"></thy-select>
  <button type="button" thyButton="default" thyAppearance="outline" (click)="toggleAllFieldsDisabled()">
    {{ allFieldsDisabled() ? 'Enable all fields' : 'Disable all fields' }}
  </button>
</div>

<thy-dynamic-form
  #dynamicForm
  [thyFields]="fields()"
  [thySize]="size()"
  [(thyValue)]="value"
  (thyValueChange)="onValueChange($event)"
  (thyStatusChange)="onStatusChange($event)"
  (thyFieldValueChange)="onFieldValueChange($event)"
  (thySubmit)="onSubmit($event)">
  <thy-form-group-footer thyAlign="right">
    <button type="submit" [thyButton]="'primary'">Save</button>
    <button type="reset" [thyButton]="'default'" thyAppearance="link">Reset</button>
  </thy-form-group-footer>
</thy-dynamic-form>

<div class="d-flex align-items-center">
  <span class="mr-2">Status</span>
  @if (status()) {
    <thy-tag [thyColor]="statusColor()" thySize="sm">{{ statusText() }}</thy-tag>
  }
</div>

<div class="thy-typography mt-4" thyRow [thyGutter]="30">
  <div thyCol [thySpan]="11">
    <p class="mb-2">Value</p>
    <pre class="mb-0"><code>{{ value() | json }}</code></pre>
  </div>
  <div thyCol [thySpan]="11">
    <p class="mb-2">Submit Value</p>
    <pre class="mb-0"><code>{{ lastSubmit() | json }}</code></pre>
  </div>
</div>
