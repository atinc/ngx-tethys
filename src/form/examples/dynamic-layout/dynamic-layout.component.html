<div class="mb-4">
  <span class="mr-2">Form Layout:</span>
  <thy-button-group thySize="md" thyAppearance="outline">
    @for (layout of layouts; track layout.value) {
      <button thyButton (click)="updateLayout(layout)" [ngClass]="{ active: layout === currentLayout() }">
        {{ layout.text }}
      </button>
    }
  </thy-button-group>
</div>

<thy-dynamic-form [thyFields]="fields" [thyLayout]="currentLayout().value" [(thyValue)]="value" (thySubmit)="onSubmit($event)">
  <thy-form-group-footer>
    <button type="submit" [thyButton]="'primary'" [thyLoading]="saving()" thyLoadingText="Logining">Login</button>
    <button type="button" [thyButton]="'default'" thyAppearance="link">Cancel</button>
  </thy-form-group-footer>
</thy-dynamic-form>
