<div class="mt-3">
  <span>icon传参数:</span>
  <thy-vote
    class="mr-3 ml-3"
    [thyCount]="vote_count"
    [thyVoted]="has_voted()"
    [thySize]="'sm'"
    thyIcon="star"
    (click)="toggleVote($event)"></thy-vote>
  <thy-vote
    class="mr-3"
    thyColor="primary"
    thyAppearance="subtle"
    [thyCount]="vote_count"
    [thyVoted]="has_voted()"
    [thySize]="'sm'"
    thyIcon="bell"
    (click)="toggleVote($event)"></thy-vote>
  <thy-vote
    thyColor="success"
    thyAppearance="subtle"
    [thyCount]="vote_count1"
    [thyVoted]="has_voted()"
    [thyRound]="true"
    thyIcon="app-bulletin"
    (click)="toggleVote($event)"></thy-vote>
</div>

<div class="mt-3">
  <span>icon传模板:</span>
  <thy-vote class="mr-3 ml-3" [thyCount]="vote_count" [thyVoted]="has_voted()" [thyRound]="true" thySize="sm" (click)="toggleVote($event)">
    <ng-template #voteIcon>
      <img src="https://github.githubassets.com/images/icons/emoji/unicode/2764.png" />
    </ng-template>
  </thy-vote>
  <thy-vote
    class="mr-3"
    thyColor="primary"
    thyAppearance="subtle"
    [thyCount]="vote_count"
    [thyVoted]="has_voted()"
    [thyRound]="true"
    thySize="sm"
    (click)="toggleVote($event)">
    <ng-template #voteIcon>
      <img src="https://github.githubassets.com/images/icons/emoji/unicode/2764.png" />
    </ng-template>
  </thy-vote>
  <thy-vote
    class="mr-3"
    thyColor="success"
    thyAppearance="subtle"
    [thyCount]="vote_count"
    [thyVoted]="has_voted()"
    [thyRound]="true"
    (click)="toggleVote($event)">
    <ng-template #voteIcon>
      <img src="https://github.githubassets.com/images/icons/emoji/unicode/2764.png" />
    </ng-template>
  </thy-vote>
</div>
