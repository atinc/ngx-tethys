<thy-button-group thySize="sm" thyAppearance="outline">
  @for (item of sizes; track $index) {
    <button thyButton (click)="size = item.value" [ngClass]="{ active: item.value === size }">
      {{ item.value }}
    </button>
  }
</thy-button-group>

<div class="mt-4">
  <thy-button-group [thySize]="size" thyAppearance="outline">
    <button thyButton class="disabled">Left</button>
    <button thyButton class="active">Middle</button>
    <button thyButton>Right</button>
  </thy-button-group>
</div>

<div class="mt-2">
  <thy-button-group [thySize]="size" thyAppearance="outline">
    <button thyButton thyColor="primary" class="disabled">Left</button>
    <button thyButton thyColor="primary" class="active">Middle</button>
    <button thyButton thyColor="primary">Right</button>
  </thy-button-group>
</div>

<div class="mt-2">
  <thy-button-group [thySize]="size" thyAppearance="fill">
    <button thyButton="primary"><thy-icon thyIconName="angle-left"></thy-icon>Backward</button>
    <button thyButton="primary">Forward <thy-icon thyIconName="angle-right"></thy-icon></button>
  </thy-button-group>
</div>

<thy-button-group class="mt-2" [thySize]="size" thyAppearance="fill">
  <button thyButton="primary"><thy-icon thyIconName="plus"></thy-icon>New</button>
  <button thyButton="primary"><thy-icon thyIconName="caret-down"></thy-icon></button>
</thy-button-group>

<div class="mt-4">
  <div class="mb-2">Use Button Icon</div>
  <thy-button-group [thySize]="size" thyAppearance="outline">
    <button thyButton thyIcon="user-add" class="active"></button>
    <button thyButton thyIcon="list-sample-fill"></button>
  </thy-button-group>
</div>

<div class="mt-4">
  <div class="mb-2">Clear Min Width</div>
  <thy-button-group [thySize]="size" thyAppearance="outline" thyClearMinWidth="true">
    <button thyButton thyColor="primary" class="disabled">Left</button>
    <button thyButton thyColor="primary" class="active">Middle</button>
    <button thyButton thyColor="primary">Right</button>
  </thy-button-group>
</div>
