@for (item of appearances; track item.value) {
  <div [class.mt-3]="$index > 0">
    <div class="mb-2 text-muted">{{ item.label }}</div>
    <thy-space>
      @for (type of types; track type.value) {
        <button *thySpaceItem [thyButton]="type.value" [thyAppearance]="item.value">{{ type.label }}</button>
      }
    </thy-space>
  </div>
}
