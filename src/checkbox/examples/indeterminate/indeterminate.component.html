<div class="body">
  <label
    thyCheckbox
    [thyIndeterminate]="indeterminate"
    [(ngModel)]="checkedAll"
    (ngModelChange)="selectAll($event)"
    thyLabelText="Check all"
    class="mb-2"></label>
  <thy-checkbox-group [(ngModel)]="values" [thyOptions]="options" (ngModelChange)="select($event)"></thy-checkbox-group>
</div>
