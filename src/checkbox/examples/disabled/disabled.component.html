<div class="mb-4">
  <p class="mb-2">单框禁用</p>
  <label thyCheckbox thyLabelText="Checkbox" [thyDisabled]="true"></label>
</div>

<div class="mb-4">
  <p class="mb-2">选项禁用</p>
  <thy-checkbox-group [(ngModel)]="values" [thyOptions]="disabledOptions"></thy-checkbox-group>
</div>

<div class="mb-4">
  <p class="mb-2">整组禁用</p>
  <thy-checkbox-group [(ngModel)]="groupValues" [thyOptions]="allDisabledOptions" [thyDisabled]="true"></thy-checkbox-group>
</div>
