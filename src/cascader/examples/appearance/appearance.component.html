<thy-button-group class="mb-3" thySize="md" thyAppearance="outline">
  @for (item of appearances; track $index) {
    <button thyButton (click)="appearance = item" [ngClass]="{ active: item === appearance }">
      {{ item }}
    </button>
  }
</thy-button-group>
<thy-cascader [thyOptions]="areaCode" [(ngModel)]="values" [thyAppearance]="appearance" [thyPlaceholder]="appearance"></thy-cascader>
