<button thyButton="primary" [thyDropdown]="menu">Dropdown <thy-icon thyName="caret-down"></thy-icon></button>

<thy-dropdown-menu #menu>
  <a thyDropdownMenuItem href="javascript:;">
    <thy-icon thyName="plus" thyDropdownMenuItemIcon></thy-icon>
    <span thyDropdownMenuItemName>New</span>
  </a>
  <a thyDropdownMenuItem href="javascript:;">
    <thy-icon thyName="more-vertical" thyDropdownMenuItemIcon></thy-icon>
    <span thyDropdownMenuItemName>Right submenu</span>
    <thy-icon thyName="angle-right" thyDropdownMenuItemExtendIcon></thy-icon>
    <thy-dropdown-submenu thyDirection="right">
      <a thyDropdownMenuItem href="javascript:;">
        <span thyDropdownMenuItemName>Submenu1</span>
        <thy-icon thyName="angle-right" thyDropdownMenuItemExtendIcon></thy-icon>
        <thy-dropdown-submenu>
          <a thyDropdownMenuItem href="javascript:;">
            <span thyDropdownMenuItemName>Submenu1 of Submenu1</span>
          </a>
          <a thyDropdownMenuItem href="javascript:;">
            <span thyDropdownMenuItemName>Submenu2 of Submenu1</span>
          </a>
        </thy-dropdown-submenu>
      </a>
      <a thyDropdownMenuItem href="javascript:;">
        <span thyDropdownMenuItemName>Submenu2</span>
      </a>
    </thy-dropdown-submenu>
  </a>
  <a thyDropdownMenuItem href="javascript:;">
    <thy-icon thyName="settings" thyDropdownMenuItemIcon></thy-icon>
    <span thyDropdownMenuItemName>Left submenu</span>
    <thy-icon thyName="angle-right" thyDropdownMenuItemExtendIcon></thy-icon>
    <thy-dropdown-submenu thyDirection="left">
      <a thyDropdownMenuItem href="javascript:;">
        <span thyDropdownMenuItemName>Submenu1</span>
      </a>
      <a thyDropdownMenuItem href="javascript:;">
        <span thyDropdownMenuItemName>Submenu2</span>
      </a>
      <a thyDropdownMenuItem href="javascript:;">
        <span thyDropdownMenuItemName>Submenu3</span>
      </a>
      <a thyDropdownMenuItem href="javascript:;">
        <span thyDropdownMenuItemName>Submenu4</span>
      </a>
      <a thyDropdownMenuItem href="javascript:;">
        <span thyDropdownMenuItemName>Submenu5</span>
      </a>
      <a thyDropdownMenuItem href="javascript:;">
        <span thyDropdownMenuItemName>Submenu6</span>
      </a>
    </thy-dropdown-submenu>
  </a>
  <a thyDropdownMenuItem href="javascript:;">
    <thy-icon thyName="sort" thyDropdownMenuItemIcon></thy-icon>
    <span thyDropdownMenuItemName>Auto submenu</span>
    <thy-icon thyName="angle-right" thyDropdownMenuItemExtendIcon></thy-icon>
    <thy-dropdown-submenu thyDirection="auto">
      <a thyDropdownMenuItem href="javascript:;">
        <span thyDropdownMenuItemName>Submenu1</span>
      </a>
      <a thyDropdownMenuItem href="javascript:;">
        <span thyDropdownMenuItemName>Submenu2</span>
      </a>
      <a thyDropdownMenuItem href="javascript:;">
        <span thyDropdownMenuItemName>Submenu3</span>
      </a>
      <a thyDropdownMenuItem href="javascript:;">
        <span thyDropdownMenuItemName>Submenu4</span>
      </a>
      <a thyDropdownMenuItem href="javascript:;">
        <span thyDropdownMenuItemName>Submenu5</span>
      </a>
      <a thyDropdownMenuItem href="javascript:;">
        <span thyDropdownMenuItemName>Submenu6</span>
      </a>
    </thy-dropdown-submenu>
  </a>
</thy-dropdown-menu>
