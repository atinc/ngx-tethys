<div thyRow [thyGutter]="30">
  <div thyCol [thySpan]="12">
    <thy-tree-select
      [thyTreeNodes]="treeSelectNodes"
      [(ngModel)]="selectedValue"
      [thyAppearance]="'outline'"
      [thyPlaceholder]="'outline'"></thy-tree-select>
    <thy-tree-select
      [thyTreeNodes]="treeSelectNodes"
      [(ngModel)]="selectedValue"
      [thyAppearance]="'subtle'"
      [thyPlaceholder]="'subtle'"
      class="mt-3"></thy-tree-select>
    <thy-tree-select
      [thyTreeNodes]="treeSelectNodes"
      [(ngModel)]="selectedValue"
      [thyAppearance]="'ghost'"
      [thyPlaceholder]="'ghost'"
      class="mt-3"></thy-tree-select>
  </div>
  <div thyCol [thySpan]="12">
    <thy-tree-select
      [thyTreeNodes]="treeSelectNodes"
      [(ngModel)]="selectedValue"
      [thyAppearance]="'outline'"
      [thyDisable]="true"
      [thyPlaceholder]="'outline'"></thy-tree-select>
    <thy-tree-select
      [thyTreeNodes]="treeSelectNodes"
      [(ngModel)]="selectedValue"
      [thyAppearance]="'subtle'"
      [thyDisable]="true"
      [thyPlaceholder]="'subtle'"
      class="mt-3"></thy-tree-select>
    <thy-tree-select
      [thyTreeNodes]="treeSelectNodes"
      [(ngModel)]="selectedValue"
      [thyAppearance]="'ghost'"
      [thyDisable]="true"
      [thyPlaceholder]="'ghost'"
      class="mt-3"></thy-tree-select>
  </div>
</div>
